{% extends 'base.html' %}

{% block title %}Delete post{% endblock %}

{% block content %}
  <h2>Delete "{{ post.title }}"?</h2>
  <p>This also removes its comments.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'post_detail' post.pk %}">Cancel</a>
  </form>
{% endblock %}
