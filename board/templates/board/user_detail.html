{% extends 'base.html' %}

{% block title %}{{ person.username }}{% endblock %}

{% block content %}
  <h2>{{ person.username }}</h2>
  <p><img class="avatar-full" src="{{ person.profile.avatar_url }}" alt="{{ person.username }}&#39;s avatar" width="100" height="100"></p>
  {% if show_email %}
    <p class="meta">{{ person.email }}</p>
  {% endif %}
{% endblock %}
