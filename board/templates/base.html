<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bulletin Board{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem; line-height: 1.5; }
    header { display: flex; align-items: baseline; gap: 1rem; border-bottom: 2px solid currentColor; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.25rem; margin: 0; flex: 1; }
    a { color: #0a6cff; }
    .post, .comment { border: 1px solid rgba(128,128,128,.4); border-radius: .5rem; padding: .75rem 1rem; margin-bottom: .75rem; }
    .post h2, .comment h3 { margin: 0 0 .35rem; font-size: 1.05rem; }
    .meta { font-size: .8rem; opacity: .7; margin-bottom: .5rem; }
    .body { white-space: pre-wrap; margin: 0 0 .5rem; }
    .field { display: block; width: 100%; box-sizing: border-box; font: inherit; padding: .5rem; margin: .35rem 0 .75rem; }
    .actions { display: flex; gap: .75rem; align-items: center; margin-top: .5rem; }
    .errorlist { color: #c00; margin: 0 0 .5rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'post_list' %}" style="color:inherit;text-decoration:none">Bulletin Board</a></h1>
    {% if user.is_authenticated %}
      <span>hi, {{ user.username }}</span>
      <a href="{% url 'post_create' %}">new post</a>
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" style="all:unset;cursor:pointer;color:#0a6cff;text-decoration:underline">log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">log in</a>
    {% endif %}
  </header>

  {% block content %}{% endblock %}
</body>
</html>
